name: TCK

on: ['push', 'pull_request']

permissions:
  contents: read

jobs:
  tck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [sync, queued]

    name: A2A TCK ${{ matrix.mode }} JSON-RPC and HTTP+JSON

    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: 8.5
        extensions: dom, mbstring, zip, sqlite, pdo_sqlite
        coverage: none

    - name: Setup uv
      uses: astral-sh/setup-uv@v6

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Composer dependencies
      run: composer update --prefer-stable --no-interaction --prefer-dist

    - name: Run TCK
      env:
        A2A_QUEUE: ${{ matrix.mode == 'queued' && '1' || '0' }}
      run: composer test:tck
